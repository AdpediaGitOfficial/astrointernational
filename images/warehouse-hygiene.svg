<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="b" gradientTransform="rotate(87 .5 .5)">
      <stop offset="0" stop-color="#011437"/><stop offset="1" stop-color="#083a5a"/>
    </linearGradient>
    <radialGradient id="l1" cx="48%" cy="31%" r="55%">
      <stop offset="0" stop-color="#0a8f4f" stop-opacity="0.55"/><stop offset="1" stop-color="#0a8f4f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l2" cx="44%" cy="25%" r="50%">
      <stop offset="0" stop-color="#38cd7b" stop-opacity="0.4"/><stop offset="1" stop-color="#38cd7b" stop-opacity="0"/>
